[project]
name = "contract-resolver"
version = "0.1.0"
description = "Resolve declarative option-structure descriptions into concrete, identified option contracts — source-agnostic and backtest-safe."
readme = "README.md"
authors = [
    { name = "Stephen Zagar", email = "szagar@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
keywords = ["trading", "options", "option-chain", "resolver", "futures-options"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
    # Identity layer — Security + the symbology resolvers (incl. the future-option resolver this design adds).
    "security-universe",
]

[project.optional-dependencies]
# MassiveSource — equity/index option chains (OS/OI). Greeks real-time, price delayed.
massive = [
    "httpx>=0.26.0",
]
# BrokerSource — TastyTrade REST (chain structure + order symbol) ⊕ DXLink (greeks/quotes). Covers OF and cold chains.
broker = [
    "httpx>=0.26.0",
    "dxlink-client[tastytrade]",
]

[project.urls]
Homepage = "https://github.com/szagar/contract-resolver"
Repository = "https://github.com/szagar/contract-resolver"
Issues = "https://github.com/szagar/contract-resolver/issues"

[tool.uv.sources]
# Co-developed siblings. Swap for published versions once they stabilize.
# Editable to match the zts-massive workspace root, which vendors all three as
# editable path deps — uv requires the source declarations to agree.
security-universe = { path = "../security-universe", editable = true }
dxlink-client = { path = "../dxlink-client", editable = true }

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
    # for BrokerSource tests (mocked REST) + live broker tests
    "httpx>=0.26.0",
    "dxlink-client[tastytrade]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "tastytrade: hits the live TastyTrade feed (requires TASTYTRADE_* creds in .env).",
]
